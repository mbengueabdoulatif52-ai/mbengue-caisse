<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArchiObjectifs</title>
<meta name="theme-color" content="#1b3a52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#f4f5f7;--surf:#fff;--surf2:#f8f9fb;
  --navy:#1b3a52;--navy2:#243f59;
  --orange:#e8761a;--orange-l:rgba(232,118,26,.12);
  --violet:#e8761a;--violet-l:rgba(232,118,26,.12);--violet-b:rgba(232,118,26,.25);
  --green:#16a34a;--green-l:rgba(22,163,74,.12);
  --red:#dc2626;--red-l:rgba(220,38,38,.1);
  --yellow:#d97706;--yellow-l:rgba(217,119,6,.1);
  --blue:#2563eb;--blue-l:rgba(37,99,235,.1);
  --teal:#0891b2;--teal-l:rgba(8,145,178,.1);
  --text:#1a1d23;--text2:#5a6473;--text3:#9ba8b5;
  --border:#e4e8ee;--border2:#d0d6df;
  --r:14px;--rs:9px;
  --font:'Inter',-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318;--surf:#181e26;--surf2:#1e2630;
  --text:#eef1f5;--text2:#8a98a8;--text3:#4a5a6a;
  --border:#222d3a;--border2:#2a3848;color-scheme:dark;
}}
:root[data-theme="dark"]{--bg:#0f1318;--surf:#181e26;--surf2:#1e2630;--text:#eef1f5;--text2:#8a98a8;--text3:#4a5a6a;--border:#222d3a;--border2:#2a3848;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
svg{display:block;flex-shrink:0}
a{text-decoration:none}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px}
.ld-name{font-size:20px;font-weight:900;color:#fff}.ld-name span{color:var(--orange)}
.ld-dot{width:8px;height:8px;border-radius:50%;background:var(--violet);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* AUTH */
#auth{position:fixed;inset:0;background:var(--navy);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:998;padding:32px;text-align:center}
.auth-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px}.auth-title span{color:var(--orange)}
.auth-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px}
.auth-btn{display:flex;align-items:center;gap:10px;background:#fff;color:#1a2332;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.auth-btn svg{width:20px;height:20px}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--navy);padding:0 16px;height:52px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:100}
.tb-back{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-back svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.5}
.tb-info{flex:1}
.tb-title{font-size:13px;font-weight:700;color:#fff}
.tb-sub{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.06em;font-weight:500}
.tb-new{background:var(--violet);color:#fff;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.tb-new svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.5}

/* TABS */
.tabs{background:var(--surf);border-bottom:1px solid var(--border);display:flex}
.tab{flex:1;padding:11px 0;font-size:12px;font-weight:600;color:var(--text3);text-align:center;border-bottom:2px solid transparent;transition:.15s;cursor:pointer}
.tab.active{color:var(--violet);border-bottom-color:var(--violet)}

/* WEEK BAR */
.week-bar{background:var(--surf);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px}
.week-selector{display:flex;align-items:center;gap:7px;background:var(--bg);border:1.5px solid var(--border2);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--text)}
.week-selector svg{width:13px;height:13px;stroke:var(--text2);fill:none;stroke-width:2}
.wk-arr{width:28px;height:28px;border-radius:7px;background:var(--bg);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.wk-arr svg{width:13px;height:13px;stroke:var(--text2);fill:none;stroke-width:2.5}
.week-bar-spacer{flex:1}
.week-badge{font-size:10px;font-weight:700;color:var(--violet);background:var(--violet-l);border-radius:20px;padding:3px 10px}

/* MAIN */
.main{padding:14px 0}

/* DAYS STRIP — scroll horizontal limité au bandeau, pas au body */
.days-strip-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.days-strip-wrap::-webkit-scrollbar{display:none}
.days-strip{display:flex;gap:8px;padding:0 16px 12px;width:max-content}
/* compatibilité : garde .days-grid comme alias */
.days-grid{display:flex;gap:8px;padding:0 16px 12px;width:max-content;margin-bottom:0}

/* DAY COLUMN */
.day-col{width:145px;flex-shrink:0;background:var(--surf);border-radius:var(--r);border:1.5px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.day-col.today{border-color:var(--violet)}
.day-col.today .day-name{color:var(--violet)}
.day-col.today .day-date{color:var(--violet)}
.day-head{padding:11px 12px 9px;border-bottom:2px solid var(--border)}
.day-col.today .day-head{border-bottom-color:var(--violet)}
.day-name{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.day-date{font-size:22px;font-weight:800;color:var(--text);line-height:1;margin-top:1px}
.day-count{margin-top:5px;display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:2px 7px;font-size:9px;font-weight:700}
.day-count.has{background:var(--violet-l);color:var(--violet)}
.day-count.empty{background:var(--bg);color:var(--text3)}

.day-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.day-empty{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 8px;color:var(--text3);font-size:11px;font-style:italic}

/* ENTRY */
.entry{border-radius:var(--rs);padding:8px 9px;border-left:3px solid transparent;cursor:pointer;transition:.1s}
.entry:active{opacity:.75}
.entry.c-violet{border-left-color:var(--violet);background:var(--violet-l)}
.entry.c-orange{border-left-color:var(--orange);background:var(--orange-l)}
.entry.c-green{border-left-color:var(--green);background:var(--green-l)}
.entry.c-blue{border-left-color:var(--blue);background:var(--blue-l)}
.entry.c-teal{border-left-color:var(--teal);background:var(--teal-l)}
.entry.c-yellow{border-left-color:var(--yellow);background:var(--yellow-l)}
.entry.c-red{border-left-color:var(--red);background:var(--red-l)}
.entry-label{font-size:11px;font-weight:700;color:var(--text);line-height:1.3}
.entry-comment{font-size:10px;color:var(--text2);margin-top:2px;line-height:1.4}
.entry-badge{display:inline-block;font-size:8px;font-weight:700;border-radius:4px;padding:1px 5px;margin-top:4px;letter-spacing:.04em}
.badge-proj{background:rgba(109,78,230,.15);color:var(--violet)}
.badge-libre{background:rgba(232,118,26,.15);color:var(--orange)}

/* ADD BUTTON IN DAY */
.day-add{margin:0 8px 8px;border:1.5px dashed var(--border2);border-radius:var(--rs);padding:6px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}
.day-add:hover,.day-add:active{border-color:var(--violet);color:var(--violet);background:var(--violet-l)}
.day-add svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5}

/* RECAP */
.recap{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px}
.recap-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
.recap-title{font-size:14px;font-weight:700}
.recap-sub{font-size:11px;color:var(--text2);margin-top:2px}
.recap-badge{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--violet)}
.recap-dot{width:7px;height:7px;border-radius:50%;background:var(--violet)}
.recap-grid{display:grid;grid-template-columns:auto 1fr;gap:10px}
.recap-total{background:var(--violet);border-radius:var(--rs);padding:14px 16px;color:#fff;display:flex;align-items:center;gap:16px;grid-column:1/2}
.rt-val{font-size:30px;font-weight:900;line-height:1}
.rt-label{font-size:10px;opacity:.7;font-weight:500;margin-top:2px}
.recap-stats{background:var(--surf2);border-radius:var(--rs);border:1px solid var(--border);padding:12px;grid-column:2/3}
.recap-stats-title{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none;padding-bottom:0}
.stat-name{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--text);flex:1;min-width:0}
.stat-name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-count{font-size:11px;font-weight:700;color:var(--text);flex-shrink:0}
.stat-bar-wrap{margin-top:3px;background:var(--border);border-radius:3px;height:3px;overflow:hidden}
.stat-bar{height:3px;border-radius:3px;transition:.3s}
.recap-days{background:var(--surf2);border-radius:var(--rs);border:1px solid var(--border);padding:12px;grid-column:1/-1}
.recap-days-title{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.recap-days-row{display:flex;gap:3px}
.recap-day-pill{flex:1;text-align:center}
.rdp-day{font-size:8px;font-weight:700;color:var(--text3);margin-bottom:4px}
.rdp-circle{width:28px;height:28px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;transition:.2s}
.rdp-circle.filled{background:var(--violet);color:#fff}
.rdp-circle.empty{background:var(--surf);border:1.5px solid var(--border);color:var(--text3)}
.rdp-circle.today-empty{border:2px solid var(--violet)}
.rdp-sub{font-size:8px;color:var(--text3);margin-top:3px}

/* BILAN PAGE */
.bilan-section{padding:14px 16px}
.bilan-card{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.bilan-card-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.bilan-empty{color:var(--text3);font-size:12px;font-style:italic;padding:6px 0}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surf);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:93vh;display:flex;flex-direction:column;overflow:hidden}
.modal-bar{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.modal-head{padding:14px 18px 12px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
.modal-h{font-size:15px;font-weight:700}
.modal-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:13px;height:13px;stroke:var(--text2);fill:none;stroke-width:2.5}
.modal-body{overflow-y:auto;flex:1;padding:14px 18px}
.modal-section{margin-bottom:16px}
.modal-section-title{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.field-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px}
.field-input{width:100%;border:1.5px solid var(--border2);border-radius:var(--rs);padding:9px 11px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--surf);outline:none;transition:.15s}
.field-input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-l)}
.field-textarea{width:100%;border:1.5px solid var(--border2);border-radius:var(--rs);padding:9px 11px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--surf);resize:none;line-height:1.5;outline:none;transition:.15s}
.field-textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-l)}

/* Pick items */
.pick-list{display:flex;flex-direction:column;gap:5px}
.pick-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rs);border:1.5px solid var(--border);cursor:pointer;transition:.12s}
.pick-item:hover{border-color:var(--violet-b);background:var(--violet-l)}
.pick-item.selected{border-color:var(--violet);background:var(--violet-l)}
.pick-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pick-info{flex:1;min-width:0}
.pick-name{font-size:12px;font-weight:600;color:var(--text)}
.pick-badge{display:inline-block;font-size:8px;font-weight:700;border-radius:4px;padding:1px 5px;margin-top:2px}
.badge-encours{background:var(--blue-l);color:var(--blue)}
.badge-partiel{background:var(--yellow-l);color:var(--yellow)}
.badge-soldee{background:var(--green-l);color:var(--green)}
.pick-check{width:18px;height:18px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;flex-shrink:0}
.pick-item.selected .pick-check{opacity:1}
.pick-check svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3}

/* Create activity */
.create-act{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:var(--rs);border:1.5px dashed var(--border2);cursor:pointer;font-size:11px;font-weight:600;color:var(--text3);transition:.15s;margin-top:6px}
.create-act:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-l)}
.create-act svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;flex-shrink:0}

.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.btn-cancel{flex:1;padding:10px;border-radius:var(--rs);border:1.5px solid var(--border2);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;background:none;font-family:var(--font)}
.btn-save{flex:2;padding:10px;border-radius:var(--rs);background:var(--violet);color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:6px}
.btn-save svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5}
.btn-danger{flex:1;padding:10px;border-radius:var(--rs);background:var(--red-l);color:var(--red);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid rgba(220,38,38,.2);font-family:var(--font)}


/* OBJECTIFS */
.obj-wrap{padding:12px 0 24px}
.obj-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.obj-sum div{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--rs);padding:9px 10px}
.obj-sum b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.obj-sum small{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:.06em}
.obj-prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:5px}
.obj-prog i{display:block;height:100%;background:var(--green)}
.obj-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.obj-chip{font-size:11px;font-weight:600;padding:5px 10px;border-radius:14px;border:1.5px solid var(--border2);color:var(--text2);background:var(--surf);cursor:pointer}
.obj-chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.obj-chip.right{margin-left:auto}
.obj-grp{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.obj-gh{display:flex;align-items:center;gap:7px;padding:11px 12px;font-size:13px;font-weight:700;cursor:pointer}
.obj-gh svg{width:13px;height:13px;stroke:var(--text2);fill:none;stroke-width:2.5;transition:.15s}
.obj-grp.closed .obj-gh svg{transform:rotate(-90deg)}
.obj-gh .ct{margin-left:auto;font-size:10px;font-weight:600;color:var(--text3)}
.obj-grp.closed .obj-row{display:none}
.obj-row{padding:9px 12px;border-top:1px solid var(--border)}
.obj-r1{display:flex;align-items:center;gap:8px}
.obj-ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surf)}
.obj-ck svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.obj-ck.on{background:var(--green);border-color:var(--green)}
.obj-ck.on svg{opacity:1}
.obj-no{font-size:10px;font-weight:700;color:var(--text3);width:24px;flex:none}
.obj-nm{flex:1;min-width:0;font-size:12px;font-weight:600;line-height:1.35;cursor:pointer}
.obj-row.done .obj-nm{text-decoration:line-through;color:var(--text3)}
.obj-row.hid{opacity:.5}
.obj-r2{display:flex;align-items:center;gap:7px;margin:6px 0 0 50px}
.obj-trk{flex:1;height:6px;background:var(--bg);border-radius:3px;position:relative;min-width:60px}
.obj-trk i{position:absolute;top:0;height:6px;border-radius:3px}
.obj-trk .now{position:absolute;top:-3px;width:2px;height:12px;background:var(--orange);border-radius:1px}
.obj-meta{font-size:10px;color:var(--text3);white-space:nowrap}
.obj-pill{font-size:9px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--violet-l);color:var(--violet);white-space:nowrap}
.obj-dep{font-size:10px;color:var(--yellow);margin:4px 0 0 50px}
.obj-late{color:var(--red);font-weight:700}
.f-E{background:#5dcaa5}.f-M{background:#ef9f27}.f-F{background:#f0997b}.f-done{background:var(--green)}
.gt-wrap{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--r);overflow-x:auto}
.gt{min-width:620px;position:relative}
.gt-row{display:flex;height:30px;border-bottom:1px solid var(--border);align-items:center}
.gt-name{width:150px;flex:none;position:sticky;left:0;background:var(--surf);z-index:2;font-size:11px;font-weight:600;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;gap:5px;cursor:pointer}
.gt-name .n{color:var(--text3);font-size:9px;width:22px;flex:none}
.gt-tl{flex:1;position:relative;height:100%}
.gt-bar{position:absolute;top:9px;height:12px;border-radius:3px}
.gt-head .gt-tl span{position:absolute;top:9px;font-size:9px;color:var(--text3);font-weight:600}
.gt-grp .gt-name{background:var(--surf2);font-size:10px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}
.gt-grp{background:var(--surf2)}
.gt-line{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}
.gt-now{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);z-index:1}
.badge-obj{background:var(--violet-l);color:var(--violet)}

.cib-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

.cib-bars{display:flex;gap:3px;height:50px;margin-top:22px;position:relative}
.cib-bars .cb{flex:1;position:relative;height:100%}

  const u1=onSnapshot(collection(db,`users/${uid}/factures`),snap=>{factures=snap.docs.map(d=>({id:d.id,...d.data()}));renderObjectifs();});

  const u3=onSnapshot(collection(db,`users/${uid}/objectifs`),{includeMetadataChanges:true},snap=>{
    objectifs=snap.docs.map(d=>({id:d.id,...d.data()}));

    else if(objectifs.length&&objectifs.some(o=>(o.v||1)<OBJ_V))migrateObjectifs();

}

function objByNum(n){return objectifs.find(o=>o.num===n);}
let OSCH={};
function objSchedule(){
  OSCH={};const busy={};
  const effPreds=(o,seen=new Set())=>{const out=[];(o.preds||[]).forEach(n=>{const p=objByNum(n);if(!p||seen.has(n))return;seen.add(n);if(p.hidden)out.push(...effPreds(p,seen));else out.push(p.id);});return[...new Set(out)];};
  const go=o=>{
    if(OSCH[o.id])return OSCH[o.id];if(busy[o.id])return null;busy[o.id]=1;
    const s0=pdN(o.s),e0=pdN(o.e),dur=e0-s0;let s=s0;
    const ps=o.hidden?[]:effPreds(o);
    ps.forEach(pid=>{const p=objectifs.find(x=>x.id===pid);const r=p&&go(p);if(r&&r.e+1>s)s=r.e+1;});
    OSCH[o.id]={s,e:s+dur,shifted:s!==s0};return OSCH[o.id];
  };
  objectifs.forEach(go);
}
const objX=n=>((Math.max(OBJ_DS,Math.min(OBJ_DE,n))-OBJ_DS)/(OBJ_DE-OBJ_DS))*100;
function objVisible(o){
  if(o.hidden&&!objUi.showHid)return false;
  if(objUi.per){const[,a,b]=OBJ_PERIODS[objUi.per];const r=OSCH[o.id];if(r.e<pdN(a)||r.s>pdN(b))return false;}
  return true;
}
function objEntries(id){return activites.filter(a=>a.objectifId===id).length;}
function moShort(n){const d=new Date(n*DAYMS);return MONTHS[d.getUTCMonth()];}
function objPeriodLabel(r){const a=moShort(r.s),b=moShort(r.e);const ya=new Date(r.s*DAYMS).getUTCFullYear(),yb=new Date(r.e*DAYMS).getUTCFullYear();return a===b&&ya===yb?a:`${a}${ya!==yb?' '+String(ya).slice(2):''}–${b} ${String(yb).slice(2)}`;}

function renderObjGantt(sorted,tN){
  const months=[];for(let m=0;m<14;m++){const d=new Date(Date.UTC(2026,10+m,1));months.push({x:objX(d.getTime()/DAYMS),l:MONTHS[d.getUTCMonth()]});}
  let g=`<div class="gt-wrap"><div class="gt"><div class="gt-row gt-head"><div class="gt-name" style="cursor:default;color:var(--text3);font-size:9px">OBJECTIF</div><div class="gt-tl">${months.map(m=>`<span style="left:calc(${m.x}% + 3px)">${m.l}</span>`).join('')}</div></div>`;
  OBJ_PILLARS.forEach((pn,pi)=>{
    const list=sorted.filter(o=>o.p===pi&&objVisible(o));if(!list.length)return;
    g+=`<div class="gt-row gt-grp"><div class="gt-name" style="cursor:default">${esc(pn)}</div><div class="gt-tl"></div></div>`;
    list.forEach(o=>{const r=OSCH[o.id],x1=objX(r.s),x2=objX(r.e+1);
      g+=`<div class="gt-row"><div class="gt-name" onclick="openObjModal('${o.id}')" title="${esc(o.name)}"><span class="n">E${o.num}</span>${esc(o.name)}</div><div class="gt-tl">${months.map(m=>`<div class="gt-line" style="left:${m.x}%"></div>`).join('')}${tN>=OBJ_DS&&tN<OBJ_DE?`<div class="gt-now" style="left:${objX(tN)}%"></div>`:''}<div class="gt-bar ${o.done?'f-done':'f-'+o.f}" style="left:${x1}%;width:${Math.max(1,x2-x1)}%;${o.hidden?'opacity:.35':''}" onclick="openObjModal('${o.id}')"></div></div></div>`;});
  });
  return g+`</div></div><div style="font-size:10px;color:var(--text3);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap"><span><span class="f-E" style="display:inline-block;width:10px;height:8px;border-radius:2px"></span> Faisabilité élevée</span><span><span class="f-M" style="display:inline-block;width:10px;height:8px;border-radius:2px"></span> Moyenne</span><span><span class="f-F" style="display:inline-block;width:10px;height:8px;border-radius:2px"></span> Faible</span><span><span class="f-done" style="display:inline-block;width:10px;height:8px;border-radius:2px"></span> Fait</span></div>`;
}

function objCycle(num,preds){const seen=new Set();const st=[...preds];while(st.length){const p=st.pop();if(p===num)return true;if(seen.has(p))continue;seen.add(p);const o=objByNum(p);if(o)st.push(...(o.preds||[]));}return false;}
window.saveObj=async function(){
  const o=objectifs.find(x=>x.id===objEditing);if(!o)return;
  const err=m=>{document.getElementById('om-err').textContent=m;};
  const s=document.getElementById('om-s').value,e=document.getElementById('om-e').value;
  if(!s||!e)return err('Renseigne une date de début et une date de fin.');
  if(pdN(e)<pdN(s))return err('La fin doit être après le début.');
  const raw=document.getElementById('om-p').value.trim();
  const preds=raw?raw.split(/[,;\s]+/).filter(Boolean).map(x=>Number(String(x).replace(/^E/i,''))):[];
  const bad=preds.filter(p=>isNaN(p)||!objByNum(p)||p===o.num);
  if(bad.length)return err(`Numéro invalide. Utilise des numéros d'objectifs existants, différents de ${o.num}.`);
  if(objCycle(o.num,preds))return err('Ces prédécesseurs créent une boucle de dépendances.');
  try{
    await updateDoc(doc(db,`users/${uid}/objectifs/${o.id}`),{s,e,preds:[...new Set(preds)],d:Number(document.getElementById('om-d').value),f:document.getElementById('om-f').value,updatedAt:Date.now()});
    closeObjModal();toast('Objectif mis à jour ✓');
  }catch(x){err('Erreur : '+x.message);}
};

  <div class="cib-years">${years.map(v=>`<button class="${v===y?'on':''}" onclick="setCibYear(${v})">${v}</button>`).join('')}</div>
  <div class="cib-card">
    <div class="cib-row"><span class="cib-lbl">Chiffre d'affaires ${y}</span>${pill}</div>
    <div class="cib-row"><span class="cib-big">${fmt(real)} F</span><span class="cib-of">sur ${fmt(target)} F</span></div>
    <div class="cib-bar"><i style="width:${target?Math.min(100,real/target*100):0}%;background:var(--orange)"></i>${y===cy&&target?`<b style="left:${Math.min(100,frac*100)}%"></b>`:''}</div>
    ${note?`<div class="cib-note">${note}</div>`:''}
    ${hbars(y,mois,target?target/nbMois:0,m0)}
    <div class="cib-note" style="color:var(--text3)">Données d'ArchiCaisse, hors remboursements et prêts. Pointillé : cible du mois${m0?' (activité démarrée en '+MOIS_COURT[m0]+')':''}.</div>
  </div>`;
  // Trésorerie (jusqu'à la date cible)
  const t=c.treso;
  if(y>=Number(t.debut.slice(0,4))&&y<=Number(t.date.slice(0,4))){
    const solde=currentSolde();
    const t0=new Date(t.debut+'T00:00:00'),t1=new Date(t.date+'T23:59:59');
    const tf=now<t0?0:now>t1?1:(now-t0)/(t1-t0);
    const rep=t.montant*tf;
    const tp=now>t1?(solde>=t.montant?cibPill('cp-ok','Atteinte'):cibPill('cp-ko','Non atteinte')):now<t0?cibPill('cp-info','Démarre le '+t.debut.split('-').reverse().join('/')):solde>=rep?cibPill('cp-ok','Dans les temps'):solde>=rep*0.9?cibPill('cp-warn','Un peu en retard'):cibPill('cp-ko','En retard');
    h+=`<div class="cib-card">
      <div class="cib-row"><span class="cib-lbl">Trésorerie · prêt du mariage et réserve</span>${tp}</div>
      <div class="cib-row"><span class="cib-big">${solde<0?'−':''}${fmt(Math.abs(solde))} F</span><span class="cib-of">sur ${fmt(t.montant)} F au ${t.date.split('-').reverse().join('/')}</span></div>
      <div class="cib-bar"><i style="width:${Math.max(0,Math.min(100,solde/t.montant*100))}%;background:var(--navy)"></i>${tf>0&&tf<1?`<b style="left:${tf*100}%"></b>`:''}</div>
      ${tf>0&&tf<1?`<div class="cib-note">Repère du jour : ${fmt(rep)} F.</div>`:''}
    </div>`;
  }
  // Prêts à des tiers (mois en cours) et dons (année)
  const ym=today.slice(0,7);
  const prets=ops.filter(o=>o.date&&o.date.startsWith(ym)&&estPretTiers(o)).reduce((s,o)=>s+(o.montant||0),0);
  const pmax=c.pretsMax||0,pr=pmax?prets/pmax:0;
  const pcol=prets>pmax?'var(--red)':pr>=0.8?'var(--yellow)':'#1a8c4e';
  const dons=ops.filter(o=>o.date&&o.date.startsWith(String(y))&&estDon(o)).reduce((s,o)=>s+(o.montant||0),0);
  const dmax=Math.round(real*(c.donsPct||0)),dr=dmax?dons/dmax:(dons?2:0);
  const dcol=dons>dmax?'var(--red)':dr>=0.8?'var(--yellow)':'#1a8c4e';
  h+=`<div class="cib-grid">
    <div class="cib-card"><div class="cib-lbl">Prêts à des tiers · ${MOIS_COURT?MOIS_COURT[now.getMonth()]:''}</div>
      <div class="cib-big" style="color:${pcol}">${fmt(prets)} F</div><div class="cib-of">plafond ${fmt(pmax)} F par mois</div>
      <div class="cib-bar"><i style="width:${Math.min(100,pr*100)}%;background:${pcol}"></i></div></div>
    <div class="cib-card"><div class="cib-lbl">Dons de l'entreprise · ${y}</div>
      <div class="cib-big" style="color:${dcol}">${fmt(dons)} F</div><div class="cib-of">plafond ${Math.round((c.donsPct||0)*1000)/10} % du CA : ${fmt(dmax)} F</div>
      <div class="cib-bar"><i style="width:${Math.min(100,dr*100)}%;background:${dcol}"></i></div></div>
  </div>`;
  el.innerHTML=h;
  
}
const MOIS_COURT=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
window.setCibYear=function(y){cibYear=y;renderCibles();renderSante();};
window.openCiblesEdit=function(){
  const c=ciblesCfg;const years=Object.keys(c.ca).map(Number).sort();
  const html=`<div class="modal-bg" id="cib-panel" onclick="if(event.target.id==='cib-panel')closeCiblesEdit()">
    <div class="modal"><div class="modal-bar"></div><div class="modal-body">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">Modifier les cibles</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:12px">Montants en FCFA.</div>
      <div class="cib-lbl" style="margin-bottom:6px">Chiffre d'affaires par année</div>
      <div class="cib-f">${years.map(y=>`<div><label for="cib-ca-${y}">${y}</label><input class="field-input" id="cib-ca-${y}" inputmode="numeric" value="${fmt(c.ca[y])}" oninput="fmtAmt(this)"></div>`).join('')}</div>
      <div class="cib-lbl" style="margin-bottom:6px">Trésorerie à constituer</div>
      <div class="cib-f">
        <div><label for="cib-t-m">Montant</label><input class="field-input" id="cib-t-m" inputmode="numeric" value="${fmt(c.treso.montant)}" oninput="fmtAmt(this)"></div>
        <div><label for="cib-t-d">Au plus tard le</label><input class="field-input" id="cib-t-d" type="date" value="${c.treso.date}"></div>
      </div>
      <div class="cib-f">
        <div><label for="cib-p">Plafond prêts à des tiers / mois</label><input class="field-input" id="cib-p" inputmode="numeric" value="${fmt(c.pretsMax)}" oninput="fmtAmt(this)"></div>
        <div><label for="cib-d">Plafond dons (% du CA)</label><input class="field-input" id="cib-d" inputmode="decimal" value="${Math.round(c.donsPct*1000)/10}"></div>
      </div>
      <div id="cib-err" style="font-size:12px;color:var(--red);min-height:16px"></div>
    </div><div class="modal-foot"><button class="btn-cancel" onclick="closeCiblesEdit()">Annuler</button><button class="btn-save" id="cib-go" onclick="saveCibles()">Enregistrer</button></div></div></div>`;
  const div=document.createElement('div');div.innerHTML=html;document.body.appendChild(div.firstChild);
}
window.closeCiblesEdit=function(){document.getElementById('cib-panel')?.remove();};
function cibNum(id){return parseFloat(String(document.getElementById(id).value).replace(/[\s  ]/g,'').replace(',','.'));}
window.saveCibles=async function(){
  const err=document.getElementById('cib-err');const years=Object.keys(ciblesCfg.ca).map(Number).sort();
  const ca={};for(const y of years){const v=cibNum('cib-ca-'+y);if(!(v>=0)){err.textContent=`Indique un chiffre d'affaires valide pour ${y}.`;return;}ca[y]=Math.round(v);}
  const tm=cibNum('cib-t-m'),td=document.getElementById('cib-t-d').value,pm=cibNum('cib-p'),dp=cibNum('cib-d');
  if(!(tm>=0)||!td){err.textContent='Indique le montant et la date de la trésorerie.';return;}
  if(!(pm>=0)){err.textContent='Indique un plafond de prêts valide (0 si aucun).';return;}
  if(!(dp>=0&&dp<=100)){err.textContent='Le plafond des dons doit être entre 0 et 100 %.';return;}
  const next=mergeCibles({ca,treso:{...ciblesCfg.treso,montant:Math.round(tm),date:td},pretsMax:Math.round(pm),donsPct:dp/100});
  const btn=document.getElementById('cib-go');btn.disabled=true;btn.textContent='Enregistrement…';
  try{
    await setDoc(doc(db,'users/'+uid+'/data/settings'),{cibles:next},{merge:true});
    ciblesCfg=next;closeCiblesEdit();renderCibles();toast('Cibles enregistrées');
  }catch(e){err.textContent='Enregistrement impossible : '+e.message;btn.disabled=false;btn.textContent='Enregistrer';}
}


function fmtAmt(el){const v=el.value.replace(/[^\d]/g,'');el.value=v?Number(v).toLocaleString('fr-FR'):'';}
window.fmtAmt=fmtAmt;
function currentSolde(){return ops.reduce((s,o)=>s+(o.type==='entree'?1:-1)*(o.montant||0),0);}
const fmt=n=>Math.round(n||0).toLocaleString('fr-FR');
function fmtK(v){if(v>=1e6)return (Math.round(v/1e5)/10).toString().replace('.',',')+' M';if(v>=1000)return Math.round(v/1000)+' k';return String(Math.round(v));}


// ── GRAPHIQUE HORIZONTAL (montants exacts)
const MOIS_LONG=['Janv.','Févr.','Mars','Avril','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
function hbars(y,mois,cibleMois,m0){
  const now=new Date(),cy=now.getFullYear();
  const max=Math.max(cibleMois||0,...mois,1)*(cibleMois?1.1:1);
  return `<div class="hb">${mois.map((v,i)=>{
    if(i<m0)return '';
    const fut=y>cy||(y===cy&&i>now.getMonth());
    return `<div class="hb-r${v?'':' zero'}${fut&&!v?' fut':''}"><span class="hb-m">${MOIS_LONG[i]}</span><span class="hb-t"><i style="width:${Math.round(v/max*100)}%"></i>${cibleMois?`<b style="left:${Math.min(100,cibleMois/max*100)}%"></b>`:''}</span><span class="hb-v">${v?fmt(v)+' F':(fut?'—':'0 F')}</span></div>`;
  }).join('')}</div>`;
}

// ── SANTÉ FINANCIÈRE (calculée depuis ArchiCaisse)
const CAT_PRET='Prêts et avances accordés',CAT_REMB='Remboursements reçus',CAT_SAL='Rémunération du gérant';
function estCharge(o){return o.type==='sortie'&&o.categorie!==CAT_PRET&&!estDon(o);}
function sumOps(f){return ops.filter(f).reduce((s,o)=>s+(o.montant||0),0);}
function renderSante(){
  const el=document.getElementById('dash-sante');if(!el)return;
  const now=new Date(),cy=now.getFullYear(),y=cibYear,ys=String(y);
  const c=ciblesCfg,ds=(c.debut&&c.debut[y])||(y+'-01-01'),m0=Number(ds.slice(5,7))-1;
  const lastM=y<cy?11:y>cy?-1:now.getMonth();
  const rows=[];
  for(let i=m0;i<=lastM;i++){const k=ys+'-'+String(i+1).padStart(2,'0');rows.push({i,ca:caPeriode(k),ch:sumOps(o=>o.date&&o.date.startsWith(k)&&estCharge(o))});}
  const ca=rows.reduce((s,r)=>s+r.ca,0),ch=rows.reduce((s,r)=>s+r.ch,0),res=ca-ch;
  const marge=ca?Math.round(res/ca*100):0;
  const actifs=rows.filter(r=>r.ca||r.ch).slice(-3);
  const chMoy=actifs.length?actifs.reduce((s,r)=>s+r.ch,0)/actifs.length:0;
  const pretsY=sumOps(o=>o.date&&o.date.startsWith(ys)&&o.type==='sortie'&&o.categorie===CAT_PRET);
  const rembY=sumOps(o=>o.date&&o.date.startsWith(ys)&&o.type==='entree'&&o.categorie===CAT_REMB);
  const pretsNets=Math.max(0,pretsY-rembY),donsY=sumOps(o=>o.date&&o.date.startsWith(ys)&&estDon(o));
  const solde=currentSolde();
  const jours=chMoy>0?Math.max(0,Math.floor(solde/(chMoy/30))):null;
  const creances=factures.reduce((s,f)=>s+Math.max(0,(f.montantTotal||0)-(f.paiements||[]).reduce((a,p)=>a+(p.montant||0),0)),0);
  const ouverts=prets.filter(p=>p.statut!=='solde').map(p=>({...p,rest:(p.montant||0)-(p.rembourse||0)})).filter(p=>p.rest>0);
  const duTot=ouverts.length?ouverts.reduce((s,p)=>s+p.rest,0):Math.max(0,sumOps(o=>o.type==='sortie'&&o.categorie===CAT_PRET)-sumOps(o=>o.type==='entree'&&o.categorie===CAT_REMB));
  const duPerso=ouverts.filter(p=>p.type==='perso').reduce((s,p)=>s+p.rest,0);
  const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const salVerse=sumOps(o=>o.type==='sortie'&&o.categorie===CAT_SAL&&(o.salaireMois===ym||(!o.salaireMois&&o.date&&o.date.startsWith(ym))));
  const salMontant=salaireCfg&&salaireCfg.actif!==false?(salaireCfg.montant||0):0;
  // Diagnostic
  let cls='ok',titre='La situation financière est saine',txt=`Marge de ${marge} % et ${jours==null?'—':jours} jours de charges couverts par la trésorerie.`;
  const partSortie=res>0?Math.round((pretsNets+donsY)/res*100):0;
  if(!ca&&!ch){cls='warn';titre='Pas encore d\'activité sur cette année';txt='Les indicateurs se rempliront avec les opérations d\'ArchiCaisse.';}
  else if(res<0){cls='';titre='Les charges dépassent le chiffre d\'affaires';txt=`Résultat de ${fmtS(res)} F sur l'année. Réduis les charges ou relance les encaissements.`;}
  else if(jours!=null&&jours<30&&partSortie>=50){cls='';titre='L\'entreprise est rentable, mais sa caisse est vide';txt=`${marge} % de marge, mais ${partSortie} % du résultat est parti en prêts et en dons.`;}
  else if(jours!=null&&jours<90){cls='warn';titre='Rentable, mais la réserve est faible';txt=`La trésorerie couvre ${jours} jours de charges ; l'objectif est de 3 mois.`;}
  const tot=Math.max(ca+rembY,1);
  const w=v=>Math.max(0,Math.round(v/tot*1000)/10);
  el.innerHTML=`
  <div class="cib-years">${Object.keys(c.ca).map(Number).sort().map(v=>`<button class="${v===y?'on':''}" onclick="setCibYear(${v})">${v}</button>`).join('')}</div>
  <div class="sf-alert ${cls}"><b>${titre}</b><div>${txt}</div></div>
  <div class="cib-card"><div class="cib-row"><span class="cib-lbl">Chiffre d'affaires par mois · ${y}</span><span class="cib-of">FCFA</span></div>${hbars(y,Array.from({length:12},(_,i)=>caPeriode(ys+'-'+String(i+1).padStart(2,'0'))),0,m0)}</div>
  <div class="cib-card"><div class="cib-lbl">Résultat par mois</div>
    <table class="sf-tbl"><tr><th>Mois</th><th>CA</th><th>Charges</th><th>Résultat</th></tr>
    ${rows.map(r=>`<tr><td>${MOIS_LONG[r.i]}</td><td>${fmt(r.ca)}</td><td>${fmt(r.ch)}</td><td style="color:${r.ca-r.ch>=0?'var(--green)':'var(--red)'}">${fmtS(r.ca-r.ch)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td>${fmt(ca)}</td><td>${fmt(ch)}</td><td style="color:${res>=0?'var(--green)':'var(--red)'}">${fmtS(res)}</td></tr></table>
    <div class="cib-note">Marge : <b>${marge} %</b> · charges moyennes : ${fmt(chMoy)} F par mois. Charges = sorties hors prêts et dons.</div></div>
  <div class="cib-card"><div class="cib-lbl">Où est passé l'argent encaissé · ${fmt(ca+rembY)} F</div>
    <div class="sf-flow"><div style="width:${w(ch)}%;background:var(--navy)"></div><div style="width:${w(pretsNets)}%;background:var(--red)"></div><div style="width:${w(donsY)}%;background:var(--yellow)"></div></div>
    <div class="sf-leg"><span><i style="background:var(--navy)"></i>Charges ${fmt(ch)}</span><span><i style="background:var(--red)"></i>Prêts nets ${fmt(pretsNets)}</span><span><i style="background:var(--yellow)"></i>Dons ${fmt(donsY)}</span><span>Reste ${fmtS(ca+rembY-ch-pretsY-donsY+0)}</span></div>
    <div class="cib-note" style="color:var(--text3)">Encaissements de l'année, remboursements reçus compris.</div></div>
  <div class="cib-grid">
    <div class="cib-card"><div class="cib-lbl">Trésorerie</div><div class="cib-big" style="color:${solde<chMoy?'var(--red)':'inherit'}">${solde<0?'−':''}${fmt(Math.abs(solde))} F</div><div class="sf-sub">${jours==null?'—':jours+' jour'+(jours>1?'s':'')+' de charges couvert'+(jours>1?'s':'')}</div><span class="cib-pill ${jours!=null&&jours>=90?'cp-ok':'cp-ko'}" style="display:inline-block;margin-top:6px">Objectif : 3 mois</span></div>
    <div class="cib-card"><div class="cib-lbl">À encaisser</div><div class="cib-big">${fmt(creances)} F</div><div class="sf-sub">factures en cours</div>${c.ca[y]?`<span class="cib-pill cp-warn" style="display:inline-block;margin-top:6px">CA ${y} possible : ${fmt(caPeriode(ys)+(y===cy?creances:0))}</span>`:''}</div>
  </div>
  <div class="cib-grid" style="margin-top:8px">
    <div class="cib-card"><div class="cib-lbl">Prêté non remboursé</div><div class="cib-big" style="color:${duTot>0?'var(--red)':'inherit'}">${fmt(duTot)} F</div><div class="sf-sub">${duPerso?'dont avance perso '+fmt(duPerso)+' F':'tous prêts confondus'}</div></div>
    <div class="cib-card"><div class="cib-lbl">Rémunération du gérant</div><div class="cib-big">${fmt(salMontant)} F</div><div class="sf-sub">prévue par mois · versé ce mois : ${fmt(salVerse)} F</div></div>
  </div>
  <div class="cib-note" style="color:var(--text3);margin:10px 2px 0">Tout est calculé à partir d'ArchiCaisse : opérations, factures et prêts.</div>`;
}
function fmtS(v){return (v<0?'−':v>0?'+':'')+fmt(Math.abs(v));}

// ── ONGLETS
let objTab='cibles';
try{const t=localStorage.getItem('archiobjectifs-tab');if(['plan','cibles','sante'].includes(t))objTab=t;}catch(e){}
if(location.hash==='#planning')objTab='plan';if(location.hash==='#cibles')objTab='cibles';
window.switchObjTab=function(t){
  objTab=t;try{localStorage.setItem('archiobjectifs-tab',t);}catch(e){}
  document.getElementById('tab-cibles').classList.toggle('active',t==='cibles');
  document.getElementById('tab-plan').classList.toggle('active',t==='plan');
  document.getElementById('tab-sante').classList.toggle('active',t==='sante');
  document.getElementById('view-sante').style.display=t==='sante'?'block':'none';
  document.getElementById('view-cibles').style.display=t==='cibles'?'block':'none';
  document.getElementById('view-plan').style.display=t==='plan'?'block':'none';
  window.scrollTo(0,0);
};
switchObjTab(objTab);

// ── TOAST
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
window.toast=toast;

</script>
</body>
